        kind:
          type: string
          enum:
          - automatic
          - replay
        attempt_number:
          type: integer
        status:
          type: string
        response_code:
          type: integer
          nullable: true
        error_message:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
    FeeScheduleResponse:
      type: object
      properties:
        transfer_fee_bps:
          type: integer
          description: Transfer fee in basis points
        conversion_fee_bps:
          type: integer
          description: FX conversion fee in basis points
        min_fee_amount:
          type: string
          description: Minimum fee as decimal string
        max_fee_amount:
          type: string
          nullable: true
          description: Maximum fee cap as decimal string (null = uncapped)
        asset:
          type: string
          description: Asset in which fees are denominated
    FeeCollectionSummary:
      type: object
      properties:
        asset:
          type: string
        total_fees:
          type: string
        tenant_fees:
          type: array
          items:
            $ref: '#/components/schemas/TenantFeeTotal'
    TenantFeeTotal:
      type: object
      properties:
        tenant_id:
          type: string
          nullable: true
        total_fees:
          type: string
    ClaimPredicate:
      type: object
      description: 'A claim predicate, in Fluxa''s declarative form. `unconditional` needs no

        other field; `before_absolute_time` / `after_absolute_time` use

        `timestamp` (Unix seconds) and `before_relative_time` uses `seconds`

        (measured from creation). `not` takes exactly one nested predicate and

        `and` / `or` take exactly two.

        '
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - unconditional
          - before_absolute_time
          - after_absolute_time
          - before_relative_time
          - not
          - and
          - or
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp in seconds (absolute-time predicates)
        seconds:
          type: integer
          format: int64
          description: Offset in seconds (before_relative_time)
        predicates:
          type: array
          items:
            $ref: '#/components/schemas/ClaimPredicate'
          description: 'Operands: one for `not`, two for `and`/`or`'
    Claimant:
      type: object
      required:
      - account
      properties:
        account:
          type: string
          description: Stellar account allowed to claim
        predicate:
          allOf:
          - $ref: '#/components/schemas/ClaimPredicate'
          description: Omitted means unconditional
    CreateClaimableBalanceRequest:
      type: object
      required:
      - asset
      - amount
      - claimants
      properties:
        asset:
          type: string
          description: Asset code (XLM, USDC, EURC)
        amount:
          type: string
          description: Decimal string, up to 7 decimal places
        claimants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Claimant'
        source_wallet_id:
          type: string
          description: Wallet that funds the balance; defaults to the configured source wallet
        sponsor_account:
          type: string
          description: 'Optional sponsor account that pays the entry reserve. Must be a

            wallet Fluxa custodies, because sponsoring requires its signature.

            '
        revoke_on_expiry:
          type: boolean
          default: false
          description: Claim an unclaimed balance back to the org once it expires
        expires_at:
          type: string
          format: date-time
          description: 'Explicit expiry. When omitted it is derived from the earliest

            absolute deadline in the claimants'' predicates.

            '
    CreateClaimableBalanceResponse:
      type: object
      properties:
        balance_id:
          type: string
          description: Stellar claimable balance ID
        reserve_required:
          type: string
          description: XLM the entry locks up (0.5, paid by the sponsor when sponsored)
        sponsored:
          type: boolean
        tx_hash:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
    ClaimableBalanceResponse:
      type: object
      properties:
        id:
          type: string
          description: Stellar claimable balance ID
        asset:
          type: string
        amount:
          type: string
        claimants:
          type: array
          items:
            $ref: '#/components/schemas/Claimant'
        sponsor:
          type: string
        status:
          type: string
          enum:
          - pending
          - claimed
          - revoked
          - expired
        revoke_on_expiry:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        claimed_at:
          type: string
          format: date-time
          nullable: true
        claimed_by:
          type: string
    LiveClaimableBalanceResponse:
      allOf:
      - $ref: '#/components/schemas/ClaimableBalanceResponse'
      - type: object
        properties:
          claimable:
            type: boolean
            description: Whether a claimant could claim right now
          on_chain:
            type: object
            nullable: true
            description: Horizon's view of the balance; absent once it is consumed
            properties:
              id:
                type: string
              asset:
                type: string
              amount:
                type: string
              sponsor:
                type: string
              last_modified_ledger:
                type: integer
    ClaimClaimableBalanceRequest:
      type: object
      properties:
        claimant_account:
          type: string
          description: 'Claimant to claim for. Required unless the balance has exactly one

            Fluxa-custodied claimant.

            '
    ClaimClaimableBalanceResponse:
      type: object
      properties:
        balance_id:
          type: string
        claimed_by:
          type: string
        amount:
          type: string
        tx_hash:
          type: string
        status:
          type: string
          enum:
          - claimed
    UsageResponse:
      type: object
      properties:
        total_requests:
          type: integer
          format: int64
        requests_today:
          type: integer
          format: int64
        transfers_count:
          type: integer
        conversions_count:
          type: integer
        batches_count:
          type: integer
    ReconciliationSummary:
      type: object
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/DailySummaryRow'
        total_ok:
          type: integer
        total_mismatch:
          type: integer
        total_not_found:
          type: integer
        pending_stuck:
          type: integer
          description: Transactions stuck in pending beyond threshold
    DailySummaryRow:
      type: object
      properties:
        date:
          type: string
          description: Date in YYYY-MM-DD format
        ok:
          type: integer
          description: Transactions reconciled successfully
        mismatch:
          type: integer
          description: Transactions with amount/asset discrepancies
        not_found:
          type: integer
          description: Transactions not found on Stellar
    IdempotencyInspectionResponse:
      type: object
      required:
      - key
      - status
      properties:
        key:
          type: string
          description: Normalized idempotency key
          example: b477c770-4f51-40be-a006-03daef194d30
        status:
          type: string
          enum:
          - processing
          - completed
          - failed
          - unknown
          description: Current lifecycle state of the key
          example: completed
        created_at:
          type: string
          format: date-time
          description: When the key was first registered
        expires_at:
          type: string
          format: date-time
          description: When the key retention window elapses
        request_hash:
          type: string
          description: SHA-256 digest of method, path, and request body
          example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        retry_after_seconds:
          type: integer
          description: Suggested wait duration in seconds before retrying (when status is processing)
          example: 2
        retry_hint:
          type: string
          description: Human-readable retry instructions (when status is processing)
        response:
          $ref: '#/components/schemas/IdempotencyStoredResponse'
    IdempotencyStoredResponse:
      type: object
      required:
      - status
      - body_truncated
      - body_size_bytes
      properties:
        status:
          type: integer
          description: Original HTTP status code
          example: 200
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Replayable HTTP response headers
        body:
          description: Original HTTP response body
        body_text:
          type: string
          description: Raw or truncated response body text
        body_truncated:
          type: boolean
          description: True if the original response body exceeded the 64 KB inspection size bound
          example: false
        body_size_bytes:
          type: integer
          description: Total size in bytes of the original response body
          example: 48
