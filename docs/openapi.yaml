    RotateWebhookSigningSecretResponse:
      allOf:
      - $ref: '#/components/schemas/WebhookSigningSecretMetadata'
      - type: object
        required: [secret]
        properties:
          secret:
            type: string
            description: Plaintext signing secret; disclosed only by this rotation response.
          overlap_window_seconds:
            type: integer
    RegisterWebhookRequest:
      type: object
