openapi: 3.0.3
info:
  title: Fluxa API
  version: 1.0.0
  description: 'Fluxa is a multi-currency digital asset platform built on Stellar. It provides

    wallets, instant transfers, FX conversions, scheduled recurring payments,

    batch disbursements, fiat on/off-ramps, and a developer-friendly webhook system.


    All endpoints under `/v1` require a Bearer API key in the `Authorization` header.


    ## API key scopes


    An API key can be limited to specific resources and actions. Scopes have the

    form `<resource>:<action>`, where action is `read` or `write`:


    | Resource | Scopes | Covers |

    |---|---|---|

    | wallets | `wallets:read`, `wallets:write` | `/v1/wallets` (create, trustlines, contract wallet changes) |

    | transfers | `transfers:read`, `transfers:write` | `/v1/transfers`, `/v1/transactions`, `/v1/schedules`, `/v1/refunds` |

    | batches | `batches:read`, `batches:write` | `/v1/transfers/batch` |

    | webhooks | `webhooks:read`, `webhooks:write` | `/v1/webhooks` |

    | reports | `reports:read`, `reports:write` | `/v1/usage` (`reports:write` is reserved for report generation) |


    Other scopes: `keys:*`, `audit:read`, `fiat:*`, `fx:*`, `fees:read`,

    `beneficiaries:*`, `compliance:*`. `<resource>:*` grants both actions on one

    resource and `*` grants everything.


    On scoped resource groups, `GET`/`HEAD` need the `read` scope and every other

    method needs the `write` scope. A key without the required scope gets `403`

    with the stable error code `INSUFFICIENT_SCOPE`, and the denial is written to

    the audit log as `api_key.scope_denied` (key id, required scope, method and

    path only; never the key itself).


    **Compatibility:** keys created without scopes (including every key that

    existed before scopes were introduced) have an empty scope list and keep full

    access. `transfers:read`/`transfers:write` continue to grant

    `batches:read`/`batches:write`, so keys issued before the batches scope keep

    working. A scoped key that holds `keys:write` can only create keys with scopes

    it holds itself. Dashboard (JWT) sessions are governed by roles, not scopes.

    '
  contact:
    name: Fluxa Engineering
    email: engineering@fluxa.io
    url: https://github.com/fluxa/fluxa
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:3000
  description: Local development
- url: https://api.fluxa.io
  description: Production
tags:
- name: Auth
  description: Tenant registration, login and API key management
- name: Wallets
  description: Stellar wallet creation, balances, and fiat deposits/withdrawals
- name: Beneficiaries
  description: Tenant-scoped beneficiary allowlists with cooling-off approval
- name: Transfers
  description: Single and batch transfers between wallets
- name: Transactions
  description: Transaction history
- name: FX
  description: Foreign-exchange quotes, conversions and rate lookups
- name: Schedules
  description: Scheduled and recurring tenant payouts
- name: Webhooks
  description: Webhook endpoint management and delivery logs
- name: Fees
  description: Fee schedule queries
- name: Admin
  description: Administrative endpoints (require admin key)
- name: System
  description: Health, metrics and fiat provider webhooks
- name: Claimable balances
  description: Claimable balance lookup and claiming
- name: Audit
  description: Append-only tenant audit events and export
- name: Data
  description: Tenant compliance exports
- name: Idempotency
  description: Inspection and recovery of idempotent operations
security:
- BearerAuth: []
paths:
  /:
    get:
      operationId: getRoot
      summary: API root
      description: Returns API metadata and links to documentation and OpenAPI specification.
      tags:
      - System
      security: []
      responses:
        '200':
          description: API metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Fluxa API
                  version:
                    type: string
                    example: 1.0.0
                  description:
                    type: string
                    example: Multi-currency digital asset platform built on Stellar
                  docs_url:
                    type: string
                    example: /docs
                  docs:
                    type: string
                    example: /docs
                  openapi_url:
                    type: string
                    example: /docs/openapi.yaml
                  openapi:
                    type: string
                    example: /docs/openapi.yaml
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /docs:
    get:
      operationId: getDocs
      summary: Interactive Swagger UI documentation
      description: Serves an interactive Swagger UI API explorer loaded from CDN.
      tags:
      - System
      security: []
      responses:
        '200':
          description: Interactive Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /docs/openapi.yaml:
    get:
      operationId: getOpenAPISpec
      summary: OpenAPI specification
      description: Returns the raw OpenAPI 3.0 YAML specification file.
      tags:
      - System
      security: []
      responses:
        '200':
          description: Raw OpenAPI 3.0 specification
          content:
            application/yaml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns service health. Checks Postgres and Redis connectivity.
      tags:
      - System
      security: []
      responses:
        '200':
          description: All services healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                services:
                  postgres: up
                  redis: up
        '503':
          description: One or more services degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: degraded
                services:
                  postgres: up
                  redis: down
        '400':
          $ref: '#/components/responses/BadRequest'
  /metrics:
    get:
      operationId: getMetrics
      summary: Server metrics
      description: 'Returns runtime metrics: uptime, request counts, active requests, error rate by status code.'
      tags:
      - System
      security: []
      responses:
        '200':
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
              example:
                started_at: '2026-01-15T10:00:00Z'
                total_requests: 142857
                active_requests: 3
                total_errors: 120
                uptime_seconds: 86400.5
                requests_by_code:
                  OK: 140000
                  Bad Request: 80
                  Not Found: 40
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/auth/register:
    post:
      operationId: registerTenant
      summary: Register a new tenant
      description: Creates a new tenant account and returns the initial API key.
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Acme Corp
              email: ops@acme.com
      responses:
        '201':
          description: Tenant registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                tenant_id: t_8f3a2b1c
                api_key: sk_live_abc123def456
                name: Acme Corp
                email: ops@acme.com
                created_at: '2026-01-15T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/auth/login:
    post:
      operationId: loginTenant
      summary: Login and issue a new API key
      description: Authenticates an existing tenant and returns a new API key.
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ops@acme.com
              password: s3cret
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                tenant_id: t_8f3a2b1c
                api_key: sk_live_abc123def456
                name: Acme Corp
                email: ops@acme.com
                created_at: '2026-01-15T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/keys:
    post:
      operationId: createAPIKey
      summary: Create an API key
      description: 'Generates a new API key for the authenticated tenant. The raw key is

        returned only in this response — it cannot be retrieved later.

        '
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
            example:
              label: Payouts integration
              scopes:
              - wallets:read
              - transfers:read
              - batches:write
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreated'
              example:
                id: k_9a8b7c6d
                key: sk_live_a1b2c3d4e5f6g7h8
                prefix: sk_live_a1b2
                label: Payouts integration
                scopes:
                - wallets:read
                - transfers:read
                - batches:write
                created_at: '2026-01-15T10:00:00Z'
        '400':
          description: One or more scopes are not recognised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: 'invalid scope: wallets:delete'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listAPIKeys
      summary: List API keys
      description: Returns all API keys for the authenticated tenant.
      tags:
      - Auth
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKeySummary'
              example:
              - id: k_9a8b7c6d
                prefix: sk_live_a1b2
                label: CI deploy key
                scopes:
                - wallets:read
                - transfers:read
                last_used_at: '2026-01-15T12:00:00Z'
                revoked_at: null
                created_at: '2026-01-15T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/keys/{id}:
    delete:
      operationId: revokeAPIKey
      summary: Revoke an API key
      description: Permanently revokes the given API key. The key can no longer be used.
      tags:
      - Auth
      parameters:
      - $ref: '#/components/parameters/KeyID'
      responses:
        '204':
          description: Key revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/wallets:
    post:
      operationId: createWallet
      summary: Create a wallet
      description: Generates a new Stellar keypair, encrypts the secret, and returns the wallet.
      tags:
      - Wallets
      responses:
        '201':
          description: Wallet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletCreated'
              example:
                id: w_1a2b3c4d
                public_key: GBXCAFE7RJHBEVGT5ANBZ7YXDU7S3Y3VQWZ5J4YKJ2D6S7F8G9H0I
                created_at: '2026-01-15T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/beneficiaries:
    get:
      operationId: listBeneficiaries
      summary: List beneficiaries
      tags:
      - Beneficiaries
      responses:
        '200':
          description: Tenant beneficiaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  beneficiaries:
                    type: array
                    items:
                      $ref: '#/components/schemas/Beneficiary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createBeneficiary
      summary: Create a beneficiary
      description: Creates a pending beneficiary. Activation is blocked until the 24-hour cooling-off period ends.
      tags:
      - Beneficiaries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBeneficiaryRequest'
      responses:
        '201':
          description: Beneficiary created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/beneficiaries/{id}:
    get:
      operationId: getBeneficiary
      summary: Get a beneficiary
      tags:
      - Beneficiaries
      parameters:
      - $ref: '#/components/parameters/BeneficiaryID'
      responses:
        '200':
          description: Beneficiary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: revokeBeneficiary
      summary: Revoke a beneficiary
      tags:
      - Beneficiaries
      parameters:
      - $ref: '#/components/parameters/BeneficiaryID'
      responses:
        '204':
          description: Beneficiary revoked
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/beneficiaries/{id}/activate:
    post:
      operationId: activateBeneficiary
      summary: Activate a beneficiary after its cooling-off period
      tags:
      - Beneficiaries
      parameters:
      - $ref: '#/components/parameters/BeneficiaryID'
      responses:
        '200':
          description: Beneficiary activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/wallets/{id}:
    get:
      operationId: getWallet
      summary: Get wallet details
      description: Returns the wallet metadata including public key and creation timestamp.
      tags:
      - Wallets
      parameters:
      - $ref: '#/components/parameters/WalletID'
      responses:
        '200':
          description: Wallet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
              example:
                id: w_1a2b3c4d
                public_key: GBXCAFE7RJHBEVGT5ANBZ7YXDU7S3Y3VQWZ5J4YKJ2D6S7F8G9H0I
                created_at: '2026-01-15T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/wallets/{id}/balances:
    get:
      operationId: getWalletBalances
      summary: Get wallet balances
      description: Returns all asset balances for the wallet from the Stellar network.
      tags:
      - Wallets
      parameters:
      - $ref: '#/components/parameters/WalletID'
      responses:
        '200':
          description: Wallet balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalances'
              example:
                wallet_id: w_1a2b3c4d
                balances:
                - asset_code: USDC
                  issuer: GA5ZSEJ6BHT2ZKGDABICHI62W25ZJUXUNFFYGLYTIEXP6CZMUWqmOvxM
                  balance: '1250.0000000'
                - asset_code: XLM
                  issuer: ''
                  balance: '42.5000000'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/wallets/{id}/trustlines:
    post:
      operationId: createTrustline
      summary: Establish a trustline
      description: Adds a trustline for an asset on the wallet so it can hold that token.
      tags:
      - Wallets
      parameters:
      - $ref: '#/components/parameters/WalletID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrustlineRequest'
            example:
              asset_code: USDC
              asset_issuer: GA5ZSEJ6BHT2ZKGDABICHI62W25ZJUXUNFFYGLYTIEXP6CZMUWqmOvxM
              limit: '100000'
      responses:
        '202':
          description: Trustline submission accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustlineResponse'
              example:
                wallet_id: w_1a2b3c4d
                asset_code: USDC
                asset_issuer: GA5ZSEJ6BHT2ZKGDABICHI62W25ZJUXUNFFYGLYTIEXP6CZMUWqmOvxM
                status: submitted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/wallets/{id}/deposit/fiat:
    post:
      operationId: depositFiat
      summary: Initiate a fiat deposit
      description: 'Starts a fiat-to-crypto deposit via the configured payment rail (e.g. Flutterwave).

        Returns a payment link the customer should be redirected to.

        '
      tags:
      - Wallets
      parameters:
      - $ref: '#/components/parameters/WalletID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiatDepositRequest'
            example:
              amount: '100.00'
              currency: NGN
              email: customer@acme.com
              name: John Doe
      responses:
        '200':
          description: Deposit initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositResponse'
              example:
                payment_link: https://checkout.flutterwave.com/pay/abc123
                reference: DEP-a1b2c3d4
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/wallets/{id}/withdraw/fiat:
    post:
      operationId: withdrawFiat
      summary: Initiate a fiat withdrawal
      description: Converts USDC from the wallet and sends fiat to a bank account.
      tags:
      - Wallets
      parameters:
      - $ref: '#/components/parameters/WalletID'
      - name: X-Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: Optional idempotency key to prevent duplicate withdrawals on network retries
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Optional idempotency key to prevent duplicate withdrawals on network retries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiatWithdrawalRequest'
            example:
              amount: '50.00'
              currency: NGN
              account_bank: GTBank
              account_number: 0123456789
      responses:
        '200':
          description: Withdrawal initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponse'
              example:
                reference: WIT-e5f6g7h8
                status: pending
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/withdrawals:
    post:
      operationId: initiateWithdrawal
      summary: Initiate a withdrawal
      description: Converts USDC from the wallet and sends fiat to a bank account, protected by idempotency.
      tags:
      - Wallets
      parameters:
      - name: X-Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: Optional idempotency key to prevent duplicate withdrawals on network retries
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Optional idempotency key to prevent duplicate withdrawals on network retries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - wallet_id
              - amount
              - currency
              - account_bank
              - account_number
              properties:
                wallet_id:
                  type: string
                  format: uuid
                amount:
                  type: string
                currency:
                  type: string
                account_bank:
                  type: string
                account_number:
                  type: string
      responses:
        '200':
          description: Withdrawal initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/transfers:
    post:
      operationId: initiateTransfer
      summary: Initiate a transfer
      description: Moves an asset between two wallets, applying platform fees.
      tags:
      - Transfers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
            example:
              from_wallet_id: w_1a2b3c4d
              to_wallet_id: w_5e6f7g8h
              asset: USDC
              amount: '100.0000000'
      parameters:
      - name: X-Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: Optional idempotency key to prevent duplicate transfers on retries
      - name: Idempotency-Key
        in: header
        required: true
        description: 'Client-generated UUID v4 that makes this request safe to retry.

          The result is held for 24 hours: a repeat with the same body

          replays the original response, a repeat with a different body or

          a concurrent repeat is rejected with 409.

          '
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Transfer accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
              example:
                id: tx_abc123
                tx_hash: ''
                type: transfer
                status: pending
                from_wallet_id: w_1a2b3c4d
                to_wallet_id: w_5e6f7g8h
                asset: USDC
                amount: '100.0000000'
                fee_amount: '0.2500000'
                net_amount: '99.7500000'
                fee_bps: 25
                created_at: '2026-01-15T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: 'Conflict: request in progress or idempotency key reused with different body'
    get:
      operationId: listTransfers
      summary: List transfers
      description: Returns all transactions for a given wallet.
      tags:
      - Transactions
      parameters:
      - name: wallet_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Filter by wallet ID
      - name: external_reference
        in: query
        required: false
        schema:
          type: string
        description: Filter by external reference
      - name: tag
        in: query
        required: false
        schema:
          type: string
        description: Filter by tag
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
        description: Maximum number of results
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
        description: Offset for pagination
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransferResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/transfers/{id}:
    get:
      operationId: getTransfer
      summary: Get transfer details
      description: Returns full details for a single transfer.
      tags:
      - Transfers
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Transaction ID
      responses:
        '200':
          description: Transfer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/transfers/batch:
    post:
      operationId: createBatch
      summary: Create a batch transfer
      description: 'Submits up to 100 transfers from a single source wallet in one request.

        Each transfer is processed independently; partial success is possible.

        '
      tags:
      - Transfers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchRequest'
            example:
              from_wallet_id: w_1a2b3c4d
              transfers:
              - to_wallet_id: w_5e6f7g8h
                asset: USDC
                amount: '50.0000000'
                reference: payroll-jan
              - to_wallet_id: w_9i0j1k2l
                asset: USDC
                amount: '75.0000000'
                reference: payroll-jan
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 'Client-generated UUID v4 that makes this request safe to retry.

          The result is held for 24 hours: a repeat with the same body

          replays the original response, a repeat with a different body or

          a concurrent repeat is rejected with 409.

          '
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Batch accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/transfers/batch/{batchId}:
    get:
      operationId: getBatch
      summary: Get batch status
      description: Returns the batch and the status of every individual transfer in it.
      tags:
      - Transfers
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
        description: Batch ID
      responses:
        '200':
          description: Batch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/transfers/batch/{batchId}/export:
    get:
      operationId: exportBatch
      summary: Export batch as CSV
      description: Downloads the batch transfer results as a CSV file.
      tags:
      - Transfers
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
        description: Batch ID
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/fiat/quote:
    post:
      operationId: previewFiat
      summary: Preview a fiat deposit or withdrawal
      description: Get a read-only quote before creating a fiat deposit or withdrawal.
      tags:
      - Wallets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - side
              - amount
              - currency
              - country
              properties:
                side:
                  type: string
                  enum:
                  - deposit
                  - withdraw
                amount:
                  type: string
                currency:
                  type: string
                country:
                  type: string
      responses:
        '200':
          description: Preview quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiatQuotePreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/fx/quote:
    post:
      operationId: getFXQuote
      summary: Get an FX quote
      description: 'Returns a time-limited conversion quote (valid for 30 seconds).

        Use the returned `id` with POST /v1/fx/convert to execute.

        '
      tags:
      - FX
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            example:
              from_asset: USDC
              to_asset: XLM
              amount: '100.0000000'
      responses:
        '200':
          description: FX quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
              example:
                id: q_abc123
                org_id: t_8f3a2b1c
                from_asset: USDC
                to_asset: XLM
                from_amount: '100.0000000'
                to_amount: '3450.2500000'
                rate: '34.5025000'
                fee: '0.2500000'
                expires_at: '2026-01-15T10:00:30Z'
                used: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/fx/convert:
    post:
      operationId: executeConversion
      summary: Execute a conversion
      description: Executes a previously quoted FX conversion. The quote must not be expired or already used.
      tags:
      - FX
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertRequest'
            example:
              wallet_id: w_1a2b3c4d
              quote_id: q_abc123
      responses:
        '200':
          description: Conversion executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversionResponse'
              example:
                id: conv_xyz789
                wallet_id: w_1a2b3c4d
                source_asset: USDC
                dest_asset: XLM
                source_amount: '100.0000000'
                dest_amount: '3450.2500000'
                fee_amount: '0.2500000'
                fee_bps: 25
                rate: '34.5025000'
                tx_hash: a1b2c3d4...
                created_at: '2026-01-15T10:00:05Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Quote expired or already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: QUOTE_EXPIRED
                  message: quote expired
                  status: 422
                  request_id: req-example
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/fx/rates:
    get:
      operationId: getFXRates
      summary: Get exchange rate
      description: Returns the current exchange rate between two assets including fees.
      tags:
      - FX
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
        description: Source asset code (e.g. USDC)
      - name: to
        in: query
        required: true
        schema:
          type: string
        description: Destination asset code (e.g. XLM)
      responses:
        '200':
          description: Rate information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateResponse'
              example:
                rate: '34.5025000'
                mid_market_rate: '34.6000000'
                spread_bps: 28
                provider: stellar
                cached_at: '2026-01-15T10:00:00Z'
                stale: false
                source_amount: '100.0000000'
                dest_amount: '3450.2500000'
                fee_amount: '0.2500000'
                net_amount: '3449.0000000'
                fee_bps: 25
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/schedules:
    post:
      operationId: createSchedule
      summary: Create a recurring tenant payout schedule
      description: Creates a tenant-scoped recurring payout that runs daily, weekly, or monthly. Requires transfers:write scope and a UUID v4 Idempotency-Key; retries with the same key and body replay the original response.
      tags:
      - Schedules
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: UUID v4 key for this schedule creation; reuse it only when retrying the same request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
            example:
              from_wallet_id: 3f1c2b8e-9a4d-4d3f-8f4e-2b6c1a9d0e77
              to_wallet_id: 4f1c2b8e-9a4d-4d3f-8f4e-2b6c1a9d0e77
              asset: USDC
              amount: '100.0000000'
              frequency: monthly
              timezone: Africa/Lagos
              missed_run_policy: skip
              start_date: '2026-02-01T00:00:00Z'
              end_date: '2026-12-31T23:59:59Z'
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listSchedules
      summary: List schedules
      description: Returns up to 100 recurring payout schedules belonging to the authenticated tenant. Requires transfers:read scope.
      tags:
      - Schedules
      responses:
        '200':
          description: List of schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedules:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/schedules/{id}/runs:
    get:
      operationId: listScheduleRuns
      summary: List payout attempts for a schedule
      description: Returns the authenticated tenant's execution history, newest occurrence first. Requires transfers:read scope. Limit defaults to 20 and is capped at 100; offset defaults to 0.
      tags:
      - Schedules
      parameters:
      - $ref: '#/components/parameters/ScheduleID'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Payout run history
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleRunResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/schedules/{id}:
    patch:
      operationId: updateSchedule
      summary: Update a schedule
      description: Updates the amount, recurrence settings, or status. Requires transfers:write scope.
      tags:
      - Schedules
      parameters:
      - $ref: '#/components/parameters/ScheduleID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleRequest'
            example:
              status: paused
              amount: '150.0000000'
      responses:
        '200':
          description: Schedule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: cancelSchedule
      summary: Cancel a schedule
      description: Cancels a recurring tenant payout schedule. Requires transfers:write scope. Cannot be undone.
      tags:
      - Schedules
      parameters:
      - $ref: '#/components/parameters/ScheduleID'
      responses:
        '204':
          description: Schedule cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/claimable-balances:
    post:
      operationId: createClaimableBalance
      summary: Create a claimable balance
      description: 'Creates a deferred payment held by the Stellar network until one of its

        claimants satisfies their predicate. The org''s source wallet funds it,

        unless `sponsor_account` names a Fluxa-custodied wallet, in which case

        the creation is wrapped in BeginSponsoringFutureReserves /

        EndSponsoringFutureReserves and the sponsor pays the 0.5 XLM entry

        reserve.


        The returned `balance_id` is derived from the create operation, so it is

        available without a second Horizon round trip.

        '
      tags:
      - Claimable balances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimableBalanceRequest'
            example:
              asset: USDC
              amount: '250.0000000'
              source_wallet_id: 3f1c2b8e-9a4d-4d3f-8f4e-2b6c1a9d0e77
              sponsor_account: GBAXPW7YQFAZPJS7WFD3XCP3MHKX4ZR3Z4WQ3L7VQZ4X3Z4WQ3L7VQZ4X
              revoke_on_expiry: true
              claimants:
              - account: GCLAIMANTACCOUNT0000000000000000000000000000000000000000
                predicate:
                  type: before_absolute_time
                  timestamp: 1798761600
              - account: GORGACCOUNT000000000000000000000000000000000000000000
                predicate:
                  type: after_absolute_time
                  timestamp: 1798761600
      responses:
        '201':
          description: Claimable balance created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClaimableBalanceResponse'
        '400':
          description: 'Malformed request, unsupported asset, no claimants, a sponsor Fluxa

            does not custody, or an invalid claim predicate.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listClaimableBalances
      summary: List claimable balances
      description: 'Lists the claimable balances created by the org. All filters are

        optional; an omitted `status` returns every balance.

        '
      tags:
      - Claimable balances
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - claimed
          - revoked
          - expired
        description: Only return balances in this state
      - name: asset
        in: query
        schema:
          type: string
        description: Only return balances for this asset
      - name: claimant
        in: query
        schema:
          type: string
        description: Only return balances that include this claimant account
      - name: expires_before
        in: query
        schema:
          type: string
          format: date-time
        description: Only return balances expiring before this RFC3339 timestamp
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: List of claimable balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  claimable_balances:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClaimableBalanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/claimable-balances/{id}:
    get:
      operationId: getClaimableBalance
      summary: Get a claimable balance
      description: 'Returns the stored balance together with its live status from Horizon

        and whether a claimant could claim right now. `on_chain` is absent when

        Horizon no longer knows the balance, which is what an already-claimed

        balance looks like.

        '
      tags:
      - Claimable balances
      parameters:
      - $ref: '#/components/parameters/ClaimableBalanceID'
      responses:
        '200':
          description: Claimable balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveClaimableBalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/claimable-balances/{id}/claim:
    post:
      operationId: claimClaimableBalance
      summary: Claim a claimable balance
      description: 'Claims on behalf of a claimant account Fluxa custodies, after checking

        the claimant''s predicate is satisfiable right now. A predicate that does

        not hold is rejected with 400 `PREDICATE_NOT_SATISFIABLE` and no

        transaction is submitted.


        `claimant_account` may be omitted when the balance has exactly one

        Fluxa-custodied claimant.

        '
      tags:
      - Claimable balances
      parameters:
      - $ref: '#/components/parameters/ClaimableBalanceID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimClaimableBalanceRequest'
            example:
              claimant_account: GCLAIMANTACCOUNT0000000000000000000000000000000000000000
      responses:
        '200':
          description: Balance claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimClaimableBalanceResponse'
        '400':
          description: 'The claimant''s predicate is not currently satisfiable

            (`PREDICATE_NOT_SATISFIABLE`), the account is not a claimant, or no

            custodied claimant could be resolved.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The balance has already been claimed, revoked or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/webhooks/secret:
    get:
      operationId: listWebhookSigningSecrets
      summary: Inspect webhook signing secret versions
      description: Returns version metadata only. Secret material is never returned by this endpoint.
      tags:
      - Webhooks
      responses:
        '200':
          description: Signing-secret metadata for the authenticated tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSigningSecretsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/webhooks/secret/rotate:
    post:
      operationId: rotateWebhookSigningSecret
      summary: Rotate the tenant webhook signing secret
      description: Generates a new secret and returns its plaintext once. A bounded overlap lets in-flight deliveries signed with the prior version remain verifiable.
      tags:
      - Webhooks
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateWebhookSigningSecretRequest'
      responses:
        '200':
          description: New signing secret, disclosed once for this idempotent operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateWebhookSigningSecretResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Another request with the same idempotency key is still processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/webhooks:
    post:
      operationId: registerWebhook
      summary: Register a webhook endpoint
      description: 'Registers a new webhook endpoint. A signing secret is generated and

        returned — it will be used to sign webhook payloads via HMAC-SHA256.

        '
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterWebhookRequest'
            example:
              url: https://acme.com/hooks/fluxa
              events:
              - transfer.initiated
              - transfer.settled
      responses:
        '201':
          description: Webhook registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointResponse'
              example:
                id: wh_abc123
                url: https://acme.com/hooks/fluxa
                secret: whsec_abc123def456
                events:
                - transfer.initiated
                - transfer.settled
                active: true
                created_at: '2026-01-15T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listWebhooks
      summary: List webhook endpoints
      description: Returns all registered webhook endpoints for the tenant.
      tags:
      - Webhooks
      responses:
        '200':
          description: List of webhook endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoints:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEndpointSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/webhooks/{id}:
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook endpoint
      description: Permanently removes the webhook endpoint.
      tags:
      - Webhooks
      parameters:
      - $ref: '#/components/parameters/WebhookID'
      responses:
        '204':
          description: Webhook deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/webhooks/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List webhook deliveries
      description: Returns delivery attempts for a specific webhook endpoint.
      tags:
      - Webhooks
      parameters:
      - $ref: '#/components/parameters/WebhookID'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
