        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/webhooks/dead-letters/{id}:
    get:
      operationId: getWebhookDeadLetter
      summary: Get a dead-lettered webhook delivery
      description: Returns one dead letter with its attempt history, including whether each attempt was an automatic retry or an operator replay.
      tags:
      - Webhooks
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The dead letter and its attempt history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeadLetter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/webhooks/dead-letters/{id}/replay:
    post:
      operationId: replayWebhookDeadLetter
      summary: Replay a dead-lettered webhook delivery
      description: Re-sends the retained event to its original endpoint, preserving the event identity while issuing a new delivery identity. The delivery is signed with the endpoint''s current signing secret and the standard timestamped signature. Repeated or concurrent replays are idempotent and return the same delivery.
      tags:
      - Webhooks
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: The dead letter was replayed (or had already been replayed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeadLetter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A request with the same idempotency key is still processing, or the original endpoint is unavailable for replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
