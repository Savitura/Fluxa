components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: 'Pass a tenant API key (`sk_live_...` or `sk_test_...`) or JWT bearer token.

        In Swagger UI, enter your token in the Authorize dialog (the ''Bearer '' prefix is added automatically).

        '
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Pass an API key as `Bearer <key>` in the `Authorization` header.

        '
    AdminAuth:
      type: http
      scheme: bearer
      bearerFormat: admin token
      description: Administrative bearer token.
  parameters:
    WalletID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Wallet ID
    KeyID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: API key ID
    ScheduleID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Schedule ID
    WebhookID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Webhook endpoint ID
    ClaimableBalanceID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 'Stellar claimable balance ID: the hex-encoded XDR of the balance ID

        (a 4-byte V0 type discriminant followed by a 32-byte hash).

        '
    BeneficiaryID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Beneficiary ID
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: invalid request body
              status: 400
              request_id: req-example
    Unauthorized:
      description: Unauthorized — missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: missing or invalid authorization header
              status: 401
              request_id: req-example
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: resource not found
              status: 404
              request_id: req-example
    Forbidden:
      description: Forbidden — admin access required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: admin access required
              status: 403
              request_id: req-example
    Conflict:
      description: Conflict — a request with this Idempotency-Key is still in flight
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: REQUEST_IN_PROGRESS
              message: a request with this Idempotency-Key is still in progress
              status: 409
              request_id: req-example
    UnprocessableEntity:
      description: Unprocessable — the Idempotency-Key was reused with a different body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_BODY
              message: this Idempotency-Key was already used with a different request body
              status: 409
              request_id: req-example
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: an unexpected error occurred
              status: 500
              request_id: req-example
  schemas:
