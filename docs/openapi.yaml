  /v1/idempotency/{key}:
    get:
      operationId: inspectIdempotencyKey
      summary: Inspect idempotency key state
      description: 'Returns the durable state of an idempotency key: processing, completed, failed, or unknown.

        On completed requests, the stored response body and status code are faithfully reproduced without re-execution.

        Clients should inspect existing keys rather than generating new keys following timeouts or network partitions.

        '
      tags:
      - Idempotency
      security:
      - BearerAuth: []
      parameters:
      - name: key
        in: path
        required: true
        description: Idempotency key (UUID or client reference string)
        schema:
          type: string
      - name: request_hash
        in: query
        required: false
        description: Expected SHA-256 request hash. If provided and mismatched, returns 422 IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_BODY.
        schema:
          type: string
      responses:
        '200':
          description: Idempotency key state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotencyInspectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
