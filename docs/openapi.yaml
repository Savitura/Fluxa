      - url
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
            - transfer.initiated
            - transfer.settled
            - transfer.failed
            - wallet.funded
            - conversion.completed
          description: 'Event types to subscribe to. Omit or pass an empty array to

            receive all events.

            '
    WebhookEndpointResponse:
      type: object
      description: Returned on create — includes the signing secret
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        secret:
          type: string
          description: HMAC-SHA256 signing secret (shown once)
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
    WebhookEndpointSummary:
      type: object
      description: Returned on list — secret is never included
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
        endpoint_id:
          type: string
        event_type:
          type: string
          enum:
          - transfer.initiated
          - transfer.settled
          - transfer.failed
          - wallet.funded
          - conversion.completed
        status:
          type: string
          enum:
          - pending
          - success
          - failed
        response_code:
          type: integer
          nullable: true
          description: HTTP status code from the endpoint
        attempt_count:
          type: integer
        last_attempt:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    WebhookDeadLetter:
      type: object
      properties:
        id:
          type: string
        endpoint_id:
          type: string
        tenant_id:
          type: string
          nullable: true
        delivery_id:
          type: string
          description: The original delivery identity that was exhausted
        event_type:
          type: string
        payload:
          type: string
          description: Event body with sensitive fields redacted
        error_message:
          type: string
        attempt_count:
          type: integer
        status:
          type: string
          enum:
          - pending
          - replayed
          - discarded
        replay_count:
          type: integer
        last_replayed_at:
          type: string
          format: date-time
          nullable: true
        replay_delivery_id:
          type: string
          nullable: true
          description: The delivery identity produced by the replay
        redacted_fields:
          type: array
          items:
            type: string
        retain_until:
          type: string
          format: date-time
          nullable: true
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryAttempt'
        created_at:
          type: string
          format: date-time
    WebhookDeliveryAttempt:
      type: object
      properties:
        id:
