  /v1/admin/transfers/{transferID}/force-settle:
    post:
      operationId: retryFailedSettlement
      summary: Retry a failed settlement
      description: 'Requeues a transaction that is currently `failed` for settlement.

        Only transfers in the authenticated tenant and environment can be

        retried. The status transition is atomic; a repeated request or a

        transfer in any other state returns `409 CONFLICT`. Requires an

        Owner or Admin role. The response means the retry was queued, not

        that Stellar has confirmed it.

        '
      tags:
      - Admin
      security:
      - AdminAuth: []
      parameters:
      - name: transferID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Failed settlement retry queued
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - transfer_id
                properties:
                  status:
                    type: string
                    enum:
                    - retry_queued
                  transfer_id:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transfer is not failed or a retry is already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/admin/compliance/reviews:
    get:
      operationId: listComplianceReviews
      summary: List compliance reviews
      description: 'Lists transfers held by compliance screening. A held transfer is

        persisted with status `compliance_hold` and is deliberately not

        enqueued for settlement until it is approved.

        '
      tags:
      - Admin
      security:
      - AdminAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - approved
          - rejected
        description: Filter by review status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      responses:
        '200':
          description: Compliance reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComplianceReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/admin/compliance/reviews/{id}:
    get:
      operationId: getComplianceReview
      summary: Get a compliance review
      tags:
      - Admin
      security:
      - AdminAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Compliance review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/admin/compliance/reviews/{id}/approve:
    post:
      operationId: approveComplianceReview
      summary: Approve a held transfer
      description: 'Releases a held transfer. The transaction is reset to `pending` and

        then re-enqueued for settlement — in that order, because the

        settlement engine skips any transaction that is not `pending`.


        Decisions are terminal: approving an already-decided review returns

        `409 REVIEW_ALREADY_DECIDED`, which is what stops two reviewers from

        releasing the same payment twice.

        '
      tags:
      - Admin
      security:
      - AdminAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  description: Reviewer notes recorded on the audit trail
      responses:
        '200':
          description: Review approved and transfer released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Review has already been decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: REVIEW_ALREADY_DECIDED
                  message: compliance review has already been decided
                  status: 409
                  request_id: req-example
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/admin/compliance/reviews/{id}/reject:
    post:
      operationId: rejectComplianceReview
      summary: Reject a held transfer
      description: 'Rejects a held transfer. The transaction is marked `failed` and is

        never enqueued for settlement.

        '
      tags:
      - Admin
      security:
      - AdminAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        '200':
          description: Review rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: REVIEW_ALREADY_DECIDED
                  message: compliance review has already been decided
                  status: 409
                  request_id: req-example
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/admin/compliance/sanctions-status:
    get:
      operationId: getSanctionsStatus
      summary: Get sanctions list status
      description: 'Reports the state of the in-memory OFAC SDN set and the outcome of the

        last refresh. `loaded: false` means screening is failing closed and

        every transfer is being held for review.

        '
      tags:
      - Admin
      security:
      - AdminAuth: []
      responses:
        '200':
          description: Sanctions list status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsStatus'
              example:
                loaded: true
                entity_count: 17423
                address_count: 621
                name_count: 16802
                updated_at: '2026-01-15T03:00:12Z'
                last_refresh:
